# Publishes the interactive site and the HTML and PDF copies of the documents with GitHub Pages.
# Nothing is built here. The files are taken as committed (R/16_build_site.R and R/11_render_report.R
# make them) and only arranged for serving by .github/scripts/assemble_pages.py.
#
# Two jobs, as in GitHub's own template: "upload" arranges and uploads the files, "publish" publishes
# them. If publishing fails, "Re-run failed jobs" repeats only the publish job, which publishes the files
# already uploaded. (With a single job, a re-run uploads a second copy and publishing then fails on it.)
name: Publish site and reports (GitHub Pages)

on:
  push:
    branches: [main]
    paths:
      - "site/index.html"
      - "site/preview.png"
      - "docs/*.html"
      - "docs/*.pdf"
      - ".github/workflows/pages.yml"
      - ".github/scripts/assemble_pages.py"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# one publication at a time; a newer one waits for the one in progress
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      # only the folders that are served, not the 200 MB of data
      - name: Check out the site, the documents and this workflow's script
        uses: actions/checkout@v7
        with:
          sparse-checkout: |
            site
            docs
            .github
      - name: Set up Pages
        id: pages
        uses: actions/configure-pages@v6
      # the site's web address goes into the link-preview tags of every page
      - name: Arrange the files for serving
        run: python3 .github/scripts/assemble_pages.py _site
        env:
          PAGES_BASE_URL: ${{ steps.pages.outputs.base_url }}
      - name: Upload the files
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  publish:
    needs: upload
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v5
